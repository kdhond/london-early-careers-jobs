<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>London Early-Careers Jobs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------------
     Theme: every colour is a CSS variable, so light and dark mode are just
     two sets of values (dark is chosen automatically from the visitor's
     system setting). Nothing below this block hard-codes a colour.
     --------------------------------------------------------------------- */
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --surface-2: #f0eee8;
    --border: #e4e1d8;
    --text: #1c2321;
    --text-muted: #5f6b66;
    --accent: #0d6b5f;
    --accent-soft: #dff1ed;
    --accent-text: #ffffff;
    --gold: #9a6700;
    --gold-soft: #fbf0d4;
    --new-bg: #e8eefc;
    --new-text: #2f4fbf;
    --shadow: 0 1px 2px rgba(28, 35, 33, 0.06);
    --shadow-hover: 0 6px 20px rgba(28, 35, 33, 0.09);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101513;
      --surface: #181e1b;
      --surface-2: #1f2623;
      --border: #2b3430;
      --text: #e9efec;
      --text-muted: #93a39c;
      --accent: #4fc3ad;
      --accent-soft: #163a33;
      --accent-text: #07201b;
      --gold: #e0b24d;
      --gold-soft: #382e14;
      --new-bg: #1c2744;
      --new-text: #9fb5ff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select { font-family: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .container { max-width: 980px; margin: 0 auto; padding: 0 20px; }

  /* ---------------- Header ---------------- */
  header.app-header { padding: 44px 0 24px; }
  .eyebrow {
    font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 8px;
  }
  .app-header h1 { font-size: 34px; line-height: 1.15; letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 700; }
  .app-header .tagline { margin: 0; color: var(--text-muted); max-width: 560px; }
  .stats-row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; color: var(--text-muted); box-shadow: var(--shadow);
  }
  .stat strong { color: var(--text); font-weight: 600; }

  /* ---------------- Search + filters ---------------- */
  .search-wrap { position: relative; }
  .search-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
  #filter-search {
    width: 100%; padding: 14px 16px 14px 44px; font-size: 16px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  #filter-search::placeholder { color: var(--text-muted); }
  #filter-search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  .quick-filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }

  /* The one-click "Hidden gems" preset: ★ picks + Direct only together. */
  .btn-gems {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 999px;
    color: var(--accent); background: var(--accent-soft); border: 1px solid transparent;
  }
  .btn-gems:hover { border-color: var(--accent); }
  .btn-gems.active { color: var(--accent-text); background: var(--accent); }

  /* Toggle pills: a hidden checkbox + a styled label, so JS still reads real checkboxes. */
  .pill { position: relative; display: inline-flex; }
  .pill input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .pill span {
    font-size: 14px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
    color: var(--text-muted); background: var(--surface); border: 1px solid var(--border);
    transition: border-color 0.12s, color 0.12s, background 0.12s;
  }
  .pill:hover span { border-color: var(--accent); color: var(--text); }
  .pill input:checked + span { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
  .pill input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .gems-hint { font-size: 13px; color: var(--text-muted); margin: 10px 2px 0; }

  .select-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .select-row select {
    flex: 1 1 150px; padding: 9px 12px; font-size: 14px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
  }

  /* ---------------- Category chips ---------------- */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 18px 20px 6px; max-width: 980px; margin: 0 auto; scrollbar-width: thin; }
  .tab {
    flex-shrink: 0; white-space: nowrap; font-size: 14px; padding: 7px 14px; border-radius: 999px;
    color: var(--text-muted); background: transparent; border: 1px solid var(--border);
  }
  .tab:hover { color: var(--text); border-color: var(--text-muted); }
  .tab.active { color: var(--accent-text); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .tab .count { opacity: 0.7; margin-left: 4px; font-weight: 400; }

  /* ---------------- Results bar ---------------- */
  .results-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 14px 0 12px; font-size: 14px; color: var(--text-muted); }
  .results-bar strong { color: var(--text); }
  .sort-wrap { display: flex; align-items: center; gap: 8px; }
  .sort-wrap select {
    padding: 7px 10px; font-size: 14px; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
  }

  /* ---------------- Job cards ---------------- */
  #jobs-list { display: flex; flex-direction: column; gap: 10px; }
  .job-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); transition: border-color 0.12s, box-shadow 0.12s;
  }
  .job-card:hover { border-color: var(--accent); box-shadow: var(--shadow-hover); }
  .job-card.open { border-color: var(--accent); }
  .job-main { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; cursor: pointer; }
  .job-main:focus-visible { outline-offset: -2px; border-radius: var(--radius); }

  .company-logo, .company-logo-placeholder {
    width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .company-logo { object-fit: contain; padding: 4px; background: #fff; }
  .company-logo-placeholder {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; color: var(--accent);
  }

  .job-body { flex: 1; min-width: 0; }
  .job-title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .job-title { font-size: 16px; font-weight: 600; line-height: 1.35; margin: 0; letter-spacing: -0.005em; }
  .job-sub { font-size: 14px; color: var(--text-muted); margin-top: 2px; }
  .job-sub .company-name { color: var(--text); font-weight: 500; }
  .job-sub a.company-domain { color: var(--text-muted); }
  .job-sub a.company-domain:hover { color: var(--accent); }
  .job-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; margin-top: 10px; font-size: 13px; color: var(--text-muted); }
  .category-tag {
    font-size: 12px; padding: 2px 9px; border-radius: 999px;
    background: var(--surface-2); color: var(--text-muted); white-space: nowrap;
  }

  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; letter-spacing: 0.02em; }
  .badge-pick { color: var(--gold); background: var(--gold-soft); }
  .badge-new { color: var(--new-text); background: var(--new-bg); }
  .badge-direct { color: var(--accent); background: var(--accent-soft); }

  .job-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .apply-btn {
    display: inline-block; background: var(--accent); color: var(--accent-text);
    border: none; border-radius: 10px; padding: 8px 18px; font-size: 14px; font-weight: 600;
  }
  .apply-btn:hover { text-decoration: none; filter: brightness(1.08); }
  .apply-menu { position: relative; display: inline-flex; align-items: center; }
  .apply-menu-toggle { border: none; background: none; color: var(--text-muted); font-size: 12px; padding: 4px 6px; }
  .apply-menu-list {
    display: none; position: absolute; right: 0; top: 100%; margin-top: 4px; z-index: 5; min-width: 150px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-hover); overflow: hidden;
  }
  .apply-menu-list.open { display: block; }
  .apply-menu-list a { display: block; padding: 8px 12px; color: var(--text); font-size: 13px; }
  .apply-menu-list a:hover { background: var(--surface-2); text-decoration: none; }
  .applied-checkbox { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); cursor: pointer; }
  .applied-checkbox input { accent-color: var(--accent); }

  /* ---------------- Expanded details ---------------- */
  .job-details { border-top: 1px solid var(--border); padding: 18px; background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
  .expanded-grid { display: grid; grid-template-columns: minmax(200px, 300px) 1fr; gap: 24px; }
  .expanded-requirements h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
  .expanded-requirements ul { margin: 0; padding-left: 18px; line-height: 1.6; font-size: 14px; }
  .expanded-description {
    max-height: 380px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; line-height: 1.65; font-size: 14px;
  }
  .expanded-description :first-child { margin-top: 0; }
  .expanded-meta { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 14px; font-size: 13px; color: var(--text-muted); }

  /* ---------------- Pagination ---------------- */
  .pagination { display: flex; justify-content: center; align-items: center; gap: 14px; padding: 28px 0 48px; color: var(--text-muted); font-size: 14px; }
  .pagination button {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 8px 16px; font-size: 14px;
  }
  .pagination button:hover:not(:disabled) { border-color: var(--accent); }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---------------- Empty / error states ---------------- */
  .state-message { text-align: center; padding: 70px 20px; color: var(--text-muted); background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
  .state-message h2 { color: var(--text); font-size: 18px; margin: 0 0 8px; }
  .state-message p { margin: 0; }

  /* ---------------- Phones ---------------- */
  @media (max-width: 640px) {
    .container { padding: 0 16px; }
    header.app-header { padding: 28px 0 16px; }
    .app-header h1 { font-size: 26px; }
    .tabs { padding-left: 16px; padding-right: 16px; }
    .job-main { flex-wrap: wrap; padding: 14px; }
    .job-actions { flex-direction: row; align-items: center; justify-content: space-between; width: 100%; padding-left: 58px; }
    .expanded-grid { grid-template-columns: 1fr; }
    .results-bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="container">
    <p class="eyebrow">Updated daily</p>
    <h1>London Early-Careers Jobs</h1>
    <p class="tagline">Graduate and entry-level roles, with a spotlight on biotech, VC, health equity and finance.</p>
    <div class="stats-row">
      <span class="stat"><strong id="stat-new-today">0</strong> new today</span>
      <span class="stat"><strong id="stat-total-active">0</strong> active jobs</span>
      <span class="stat">Last updated <strong id="stat-last-updated">never</strong></span>
    </div>
  </div>
</header>

<div class="container" id="filters-bar">
  <div class="search-wrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input type="text" id="filter-search" placeholder="Search title, company or description" aria-label="Search jobs">
  </div>

  <div class="quick-filters">
    <button type="button" id="preset-gems" class="btn-gems" title="Relevant jobs that are only on the employer's own careers page, not on Reed, Adzuna or LinkedIn: usually far fewer applicants">&#128142; Hidden gems</button>
    <label class="pill" title="Matches the biotech / VC / health-equity / finance search"><input type="checkbox" id="filter-relevant"><span>&#9733; Picks</span></label>
    <label class="pill" title="Only on the employer's own careers page, not on Reed, Adzuna or LinkedIn (usually fewer applicants)"><input type="checkbox" id="filter-direct"><span>Direct only</span></label>
    <label class="pill"><input type="checkbox" id="filter-salary"><span>Salary listed</span></label>
    <label class="pill"><input type="checkbox" id="filter-hide-applied"><span>Hide applied</span></label>
  </div>
  <p class="gems-hint"><strong>Hidden gems</strong> = picks that are only on the employer's own careers page, so usually fewer applicants.</p>

  <div class="select-row">
    <select id="filter-location" aria-label="Location"><option value="all">All locations</option></select>
    <select id="filter-date" aria-label="Date posted">
      <option value="any">Any date</option>
      <option value="1">Past 24 hours</option>
      <option value="3">Past 3 days</option>
      <option value="7">Past 7 days</option>
      <option value="30">Past 30 days</option>
    </select>
    <select id="filter-workmode" aria-label="Work mode">
      <option value="all">Any work mode</option>
      <option value="onsite">On-site</option>
      <option value="hybrid">Hybrid</option>
      <option value="remote">Remote</option>
      <option value="unknown">Not stated</option>
    </select>
    <select id="filter-source" aria-label="Source"><option value="all">All sources</option></select>
  </div>
</div>

<nav class="tabs" id="category-tabs" aria-label="Job categories"></nav>

<main class="container">
  <div class="results-bar">
    <span id="results-count"></span>
    <label class="sort-wrap">Sort by
      <select id="sort-select">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="company">Company A–Z</option>
        <option value="title">Title A–Z</option>
        <option value="salary">Highest salary</option>
      </select>
    </label>
  </div>

  <div id="jobs-list"></div>

  <div id="state-message" class="state-message" style="display:none;"></div>

  <div class="pagination" id="pagination" style="display:none;">
    <button id="page-prev">&larr; Prev</button>
    <span id="page-info">Page 1 of 1</span>
    <button id="page-next">Next &rarr;</button>
  </div>
</main>

<script>
/* =========================================================================
   State
   ========================================================================= */
const state = {
  allJobs: [],               // raw jobs from data/jobs.json
  generatedAt: null,         // when data/jobs.json was last built (see jobboard/export_static.py)
  categories: [],             // [{name, count}] computed from allJobs
  filters: {
    search: "",
    category: "all",          // matches a category name, or "all"
    location: "all",
    datePosted: "any",        // "any" | number of days
    workMode: "all",
    source: "all",
    salaryOnly: false,
    directOnly: false,        // true = hide anything also listed on a major job board
    hideApplied: false,
    relevantOnly: false,      // the personal biotech/VC/health-equity/finance toggle
  },
  sort: { column: "posted_at", dir: "desc" },
  page: 1,
  pageSize: 50,
  expandedJobId: null,
};

// The "Sort by" menu choices, mapped onto the column + direction used by the sorter below.
const SORT_OPTIONS = {
  newest:  { column: "posted_at",  dir: "desc" },
  oldest:  { column: "posted_at",  dir: "asc" },
  company: { column: "company",    dir: "asc" },
  title:   { column: "title",      dir: "asc" },
  salary:  { column: "salary_min", dir: "desc" },
};

/* =========================================================================
   localStorage helpers — every call is wrapped in try/catch, since a
   private browsing window or blocked site data can make localStorage throw
   instead of just being empty.
   ========================================================================= */
function loadAppliedJobIds() {
  try {
    const raw = localStorage.getItem("appliedJobIds");
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) {
    return new Set();
  }
}
function saveAppliedJobIds(set) {
  try {
    localStorage.setItem("appliedJobIds", JSON.stringify(Array.from(set)));
  } catch (e) { /* ignore — this is a convenience feature, not critical state */ }
}
function loadPreference(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
function savePreference(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) { /* ignore */ }
}

const appliedJobIds = loadAppliedJobIds();

/* =========================================================================
   Small formatting helpers
   ========================================================================= */
function slugify(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

function relativeTime(isoDate) {
  if (!isoDate) return "unknown";
  const then = new Date(isoDate);
  if (isNaN(then)) return "unknown";
  const diffMs = Date.now() - then.getTime();
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin < 1) return "just now";
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return `${diffHr}h ago`;
  const diffDay = Math.floor(diffHr / 24);
  return `${diffDay}d ago`;
}

function formatSalary(job) {
  if (job.salary_min && job.salary_max) {
    if (job.salary_min === job.salary_max) return `£${Math.round(job.salary_min).toLocaleString()}`;
    return `£${Math.round(job.salary_min).toLocaleString()}–£${Math.round(job.salary_max).toLocaleString()}`;
  }
  if (job.salary_text) return job.salary_text;
  return null;
}

// The domain shown under the company name — always visible, not just a
// hidden href on the name (easy to miss). "https://www.monzo.com" -> "monzo.com".
function companyDomainText(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, "");
  } catch (e) {
    return null;
  }
}

// Which apply link to use as the main "Apply" button target: prefer the
// company's own site / ATS page over LinkedIn, then Reed/Indeed, then Adzuna —
// matching the source priority already used server-side for de-duping.
const APPLY_SOURCE_PRIORITY = { greenhouse: 0, lever: 0, ashby: 0, workable: 0, recruitee: 0, smartrecruiters: 0, personio: 0, workday: 0, bamboohr: 0, teamtailor: 0, employer: 0, linkedin: 1, reed: 2, adzuna: 3 };
function bestApplyLink(job) {
  if (!job.apply_links || job.apply_links.length === 0) return null;
  return job.apply_links.slice().sort((a, b) => {
    const pa = APPLY_SOURCE_PRIORITY[a.source] ?? 9;
    const pb = APPLY_SOURCE_PRIORITY[b.source] ?? 9;
    return pa - pb;
  })[0];
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

/* =========================================================================
   Loading data — a single static file, no live backend: everything loads
   once and filters/sorts client-side.
   ========================================================================= */
async function loadData() {
  const res = await fetch("data/jobs.json");
  const payload = await res.json();
  state.allJobs = payload.jobs;
  state.generatedAt = payload.generated_at;

  computeStats();
  populateFilterOptions();
  applyFiltersAndRender();
}

function computeStats() {
  const todayUtc = new Date().toISOString().slice(0, 10);
  const newToday = state.allJobs.filter((job) => (job.first_seen_at || "").slice(0, 10) === todayUtc).length;

  const categoryCounts = {};
  for (const job of state.allJobs) {
    categoryCounts[job.category] = (categoryCounts[job.category] || 0) + 1;
  }
  state.categories = Object.entries(categoryCounts)
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => a.name.localeCompare(b.name));

  document.getElementById("stat-new-today").textContent = newToday;
  document.getElementById("stat-total-active").textContent = state.allJobs.length.toLocaleString();
  document.getElementById("stat-last-updated").textContent = relativeTime(state.generatedAt);

  renderCategoryTabs();
}

/* =========================================================================
   Category chips
   ========================================================================= */
function renderCategoryTabs() {
  const nav = document.getElementById("category-tabs");
  nav.innerHTML = "";

  const totalCount = state.categories.reduce((sum, c) => sum + c.count, 0);
  nav.appendChild(makeTabButton("All", totalCount, "all"));

  for (const cat of state.categories) {
    nav.appendChild(makeTabButton(cat.name, cat.count, cat.name));
  }
}

function makeTabButton(label, count, categoryValue) {
  const btn = document.createElement("button");
  btn.className = "tab" + (state.filters.category === categoryValue ? " active" : "");
  btn.innerHTML = `${escapeHtml(label)} <span class="count">${count}</span>`;
  btn.addEventListener("click", () => {
    state.filters.category = categoryValue;
    state.page = 1;
    updateUrlFromState();
    renderCategoryTabs();
    applyFiltersAndRender();
  });
  return btn;
}

/* =========================================================================
   Filter dropdown population (cities + sources seen in the data)
   ========================================================================= */
function populateFilterOptions() {
  const cities = new Set();
  const sources = new Set();
  for (const job of state.allJobs) {
    if (job.city) cities.add(job.city);
    for (const s of job.sources || []) sources.add(s);
  }

  const locationSelect = document.getElementById("filter-location");
  const currentLocation = locationSelect.value;
  locationSelect.innerHTML = '<option value="all">All locations</option>';
  Array.from(cities).sort().forEach((city) => {
    const opt = document.createElement("option");
    opt.value = city;
    opt.textContent = city;
    locationSelect.appendChild(opt);
  });
  if (Array.from(cities).includes(currentLocation)) locationSelect.value = currentLocation;

  const sourceSelect = document.getElementById("filter-source");
  const currentSource = sourceSelect.value;
  sourceSelect.innerHTML = '<option value="all">All sources</option>';
  Array.from(sources).sort().forEach((source) => {
    const opt = document.createElement("option");
    opt.value = source;
    opt.textContent = source;
    sourceSelect.appendChild(opt);
  });
  if (Array.from(sources).includes(currentSource)) sourceSelect.value = currentSource;
}

/* =========================================================================
   Filtering, sorting, pagination — all done client-side on the full jobs array.
   ========================================================================= */
const DIRECT_SOURCES = new Set(["greenhouse", "lever", "ashby", "workable", "recruitee", "smartrecruiters", "personio", "workday", "bamboohr", "teamtailor"]);

function isDirect(job) {
  // "Direct" = every source is an employer ATS board (no Reed/Adzuna/LinkedIn copy).
  return (job.sources || []).length > 0 && (job.sources || []).every((s) => DIRECT_SOURCES.has(s));
}

function applyFiltersAndRender() {
  const f = state.filters;
  const searchLower = f.search.trim().toLowerCase();

  let filtered = state.allJobs.filter((job) => {
    if (f.category !== "all" && job.category !== f.category) return false;
    if (f.location !== "all" && job.city !== f.location) return false;
    if (f.workMode !== "all" && job.work_mode !== f.workMode) return false;
    if (f.source !== "all" && !(job.sources || []).includes(f.source)) return false;
    if (f.salaryOnly && !(job.salary_min || job.salary_text)) return false;
    if (f.directOnly && !isDirect(job)) return false;
    if (f.hideApplied && appliedJobIds.has(job.id)) return false;
    if (f.relevantOnly && !job.is_relevant) return false;

    if (f.datePosted !== "any") {
      const days = Number(f.datePosted);
      if (!job.posted_at) return false;
      const ageMs = Date.now() - new Date(job.posted_at).getTime();
      if (ageMs > days * 24 * 60 * 60 * 1000) return false;
    }

    if (searchLower) {
      const haystack = `${job.title} ${job.company} ${job.description_text}`.toLowerCase();
      if (!haystack.includes(searchLower)) return false;
    }

    return true;
  });

  filtered.sort((a, b) => {
    const col = state.sort.column;
    let av = a[col], bv = b[col];
    if (col === "salary_min") { av = av ?? -1; bv = bv ?? -1; }
    if (av === null || av === undefined) av = "";
    if (bv === null || bv === undefined) bv = "";
    // Compare text case-insensitively so "monzo" doesn't sort after "Zopa".
    if (typeof av === "string") av = av.toLowerCase();
    if (typeof bv === "string") bv = bv.toLowerCase();
    if (av < bv) return state.sort.dir === "asc" ? -1 : 1;
    if (av > bv) return state.sort.dir === "asc" ? 1 : -1;
    return 0;
  });

  state.filteredJobs = filtered;
  renderTable();
}

/* =========================================================================
   List rendering (one card per job)
   ========================================================================= */
function renderTable() {
  const list = document.getElementById("jobs-list");
  const stateMessage = document.getElementById("state-message");
  const pagination = document.getElementById("pagination");
  const resultsCount = document.getElementById("results-count");

  if (state.allJobs.length === 0) {
    list.innerHTML = "";
    pagination.style.display = "none";
    resultsCount.textContent = "";
    stateMessage.style.display = "block";
    stateMessage.innerHTML = `<h2>No jobs yet</h2><p>The daily refresh hasn't run yet — check back soon.</p>`;
    return;
  }

  if (state.filteredJobs.length === 0) {
    list.innerHTML = "";
    pagination.style.display = "none";
    resultsCount.innerHTML = "<strong>0</strong> jobs";
    stateMessage.style.display = "block";
    stateMessage.innerHTML = `<h2>No jobs match your filters</h2><p>Try widening the date range or clearing the search box.</p>`;
    return;
  }

  stateMessage.style.display = "none";
  pagination.style.display = "flex";

  const totalPages = Math.max(1, Math.ceil(state.filteredJobs.length / state.pageSize));
  state.page = Math.min(state.page, totalPages);
  const start = (state.page - 1) * state.pageSize;
  const pageItems = state.filteredJobs.slice(start, start + state.pageSize);

  list.innerHTML = "";
  for (const job of pageItems) {
    list.appendChild(renderJobCard(job));
  }

  const n = state.filteredJobs.length;
  resultsCount.innerHTML = `<strong>${n.toLocaleString()}</strong> ${n === 1 ? "job" : "jobs"}`;
  document.getElementById("page-info").textContent = `Page ${state.page} of ${totalPages}`;
  document.getElementById("page-prev").disabled = state.page <= 1;
  document.getElementById("page-next").disabled = state.page >= totalPages;
}

function isNew(job) {
  if (!job.first_seen_at) return false;
  const ageMs = Date.now() - new Date(job.first_seen_at).getTime();
  return ageMs < 24 * 60 * 60 * 1000;
}

function renderJobCard(job) {
  const card = document.createElement("article");
  const isOpen = state.expandedJobId === job.id;
  card.className = "job-card" + (isOpen ? " open" : "");
  card.dataset.jobId = job.id;

  // Logo if we have one, otherwise the company's first letter in a tile.
  const logoCell = job.company_logo
    ? `<img class="company-logo" src="${escapeHtml(job.company_logo)}" alt="">`
    : `<div class="company-logo-placeholder" aria-hidden="true">${escapeHtml((job.company || "?").trim().charAt(0).toUpperCase())}</div>`;

  // The domain is always shown as its own visible link; when we don't know
  // it, a clearly-labelled "Find website" search link replaces it rather than a guessed URL.
  const domainText = job.company_website ? companyDomainText(job.company_website) : null;
  const findWebsiteHref = `https://www.google.com/search?q=${encodeURIComponent(job.company + " official website")}`;
  const domainHtml = domainText
    ? `<a class="company-domain" href="${escapeHtml(job.company_website)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${escapeHtml(domainText)}</a>`
    : `<a class="company-domain" href="${escapeHtml(findWebsiteHref)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Find website</a>`;

  const salary = formatSalary(job);
  const place = (job.city || job.location || "—") + (job.work_mode !== "unknown" ? " · " + job.work_mode : "");
  const posted = job.posted_at
    ? `<span title="${escapeHtml(job.posted_at)}${job.posted_at_estimated ? " (estimated — no posted date given, using first-seen date)" : ""}">${relativeTime(job.posted_at)}${job.posted_at_estimated ? "*" : ""}</span>`
    : "";

  const badges = [
    job.is_relevant ? `<span class="badge badge-pick" title="Matches the biotech / VC / health-equity / finance search">&#9733; PICK</span>` : "",
    isNew(job) ? `<span class="badge badge-new">NEW</span>` : "",
    isDirect(job) ? `<span class="badge badge-direct" title="Only listed on the employer's own careers page, not on Reed, Adzuna or LinkedIn">DIRECT</span>` : "",
  ].join("");

  const appliedChecked = appliedJobIds.has(job.id) ? "checked" : "";

  card.innerHTML = `
    <div class="job-main" role="button" tabindex="0" aria-expanded="${isOpen}">
      ${logoCell}
      <div class="job-body">
        <div class="job-title-row">
          <h3 class="job-title">${escapeHtml(job.title)}</h3>
          ${badges}
        </div>
        <div class="job-sub"><span class="company-name">${escapeHtml(job.company)}</span> · ${domainHtml}</div>
        <div class="job-meta">
          <span>${escapeHtml(place)}</span>
          ${salary ? `<span>${escapeHtml(salary)}</span>` : ""}
          ${posted}
          <span class="category-tag">${escapeHtml(job.category)}</span>
        </div>
      </div>
      <div class="job-actions">
        ${renderApplyCell(job)}
        <label class="applied-checkbox" onclick="event.stopPropagation()">
          <input type="checkbox" class="applied-toggle" data-job-id="${job.id}" ${appliedChecked}> Applied
        </label>
      </div>
    </div>
  `;

  if (isOpen) card.appendChild(renderDetails(job));

  const header = card.querySelector(".job-main");
  const toggleOpen = () => {
    state.expandedJobId = state.expandedJobId === job.id ? null : job.id;
    renderTable();
  };
  header.addEventListener("click", (e) => {
    if (e.target.closest("a, button, input, label, .apply-menu")) return;
    toggleOpen();
  });
  header.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && e.target === header) {
      e.preventDefault();
      toggleOpen();
    }
  });

  card.querySelector(".applied-toggle")?.addEventListener("change", (e) => {
    if (e.target.checked) appliedJobIds.add(job.id);
    else appliedJobIds.delete(job.id);
    saveAppliedJobIds(appliedJobIds);
    if (state.filters.hideApplied) applyFiltersAndRender();
  });

  const menuToggle = card.querySelector(".apply-menu-toggle");
  if (menuToggle) {
    menuToggle.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".apply-menu-list.open").forEach((el) => el.classList.remove("open"));
      card.querySelector(".apply-menu-list").classList.toggle("open");
    });
  }

  return card;
}

function renderApplyCell(job) {
  const best = bestApplyLink(job);
  if (!best) return "";

  if (!job.apply_links || job.apply_links.length <= 1) {
    return `<a class="apply-btn" href="${escapeHtml(best.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Apply</a>`;
  }

  const others = job.apply_links
    .map((link) => `<a href="${escapeHtml(link.url)}" target="_blank" rel="noopener">${escapeHtml(link.source)}</a>`)
    .join("");

  return `
    <span class="apply-menu">
      <a class="apply-btn" href="${escapeHtml(best.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Apply</a>
      <button class="apply-menu-toggle" title="Other apply links" aria-label="Other apply links">▾</button>
      <span class="apply-menu-list">${others}</span>
    </span>
  `;
}

function renderDetails(job) {
  const requirementsHtml = job.requirements && job.requirements.length
    ? `<ul>${job.requirements.map((r) => `<li>${escapeHtml(r)}</li>`).join("")}</ul>`
    : `<p style="color:var(--text-muted);margin:0;font-size:14px;">No requirements could be extracted for this listing.</p>`;

  const descriptionHtml = job.description_is_full
    ? job.description_html
    : `${job.description_html}<p><a href="${escapeHtml((bestApplyLink(job) || {}).url || "#")}" target="_blank" rel="noopener">View full listing →</a></p>`;

  const details = document.createElement("div");
  details.className = "job-details";
  details.innerHTML = `
    <div class="expanded-grid">
      <div class="expanded-requirements">
        <h4>Requirements</h4>
        ${requirementsHtml}
      </div>
      <div class="expanded-description">${descriptionHtml}</div>
    </div>
    <div class="expanded-meta">
      <span>Employment type: ${escapeHtml(job.employment_type || "not stated")}</span>
      <span>Years required: ${job.years_required ?? "not stated"}</span>
      <span>First seen: ${job.first_seen_at ? relativeTime(job.first_seen_at) : "unknown"}</span>
      <span>Sources: ${escapeHtml((job.sources || []).join(", "))}</span>
    </div>
  `;
  return details;
}

/* =========================================================================
   URL state (category chip, a "?c=" style deep link)
   ========================================================================= */
function updateUrlFromState() {
  const params = new URLSearchParams(window.location.search);
  if (state.filters.category === "all") params.delete("c");
  else params.set("c", slugify(state.filters.category));
  const newUrl = `${window.location.pathname}?${params.toString()}`.replace(/\?$/, "");
  history.replaceState(null, "", newUrl);
}

function readStateFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const c = params.get("c");
  if (c) {
    // The category slug is matched against the categories computed from
    // the loaded jobs once loadData() has run — see init().
    state.pendingCategorySlug = c;
  }
}

/* =========================================================================
   Wiring up the static controls
   ========================================================================= */
function initFilterControls() {
  document.getElementById("filter-search").addEventListener("input", (e) => {
    state.filters.search = e.target.value;
    state.page = 1;
    applyFiltersAndRender();
  });
  document.getElementById("filter-location").addEventListener("change", (e) => {
    state.filters.location = e.target.value;
    state.page = 1;
    applyFiltersAndRender();
  });
  document.getElementById("filter-date").addEventListener("change", (e) => {
    state.filters.datePosted = e.target.value;
    state.page = 1;
    applyFiltersAndRender();
  });
  document.getElementById("filter-workmode").addEventListener("change", (e) => {
    state.filters.workMode = e.target.value;
    state.page = 1;
    applyFiltersAndRender();
  });
  document.getElementById("filter-source").addEventListener("change", (e) => {
    state.filters.source = e.target.value;
    state.page = 1;
    applyFiltersAndRender();
  });
  document.getElementById("filter-direct").addEventListener("change", (e) => {
    state.filters.directOnly = e.target.checked;
    state.page = 1;
    syncGemsButton();
    applyFiltersAndRender();
  });
  document.getElementById("filter-salary").addEventListener("change", (e) => {
    state.filters.salaryOnly = e.target.checked;
    state.page = 1;
    applyFiltersAndRender();
  });
  document.getElementById("filter-relevant").addEventListener("change", (e) => {
    state.filters.relevantOnly = e.target.checked;
    state.page = 1;
    syncGemsButton();
    applyFiltersAndRender();
  });

  // "Hidden gems" preset: ticks Picks + Direct only together; click again to clear both.
  const gemsButton = document.getElementById("preset-gems");
  const relevantBox = document.getElementById("filter-relevant");
  const directBox = document.getElementById("filter-direct");
  function syncGemsButton() {
    gemsButton.classList.toggle("active", state.filters.relevantOnly && state.filters.directOnly);
  }
  gemsButton.addEventListener("click", () => {
    const turnOn = !(state.filters.relevantOnly && state.filters.directOnly);
    state.filters.relevantOnly = state.filters.directOnly = turnOn;
    relevantBox.checked = directBox.checked = turnOn;
    state.page = 1;
    syncGemsButton();
    applyFiltersAndRender();
  });

  const hideAppliedBox = document.getElementById("filter-hide-applied");
  hideAppliedBox.checked = loadPreference("hideApplied", false);
  state.filters.hideApplied = hideAppliedBox.checked;
  hideAppliedBox.addEventListener("change", (e) => {
    state.filters.hideApplied = e.target.checked;
    savePreference("hideApplied", e.target.checked);
    state.page = 1;
    applyFiltersAndRender();
  });

  document.getElementById("sort-select").addEventListener("change", (e) => {
    state.sort = { ...SORT_OPTIONS[e.target.value] };
    state.page = 1;
    applyFiltersAndRender();
  });

  document.getElementById("page-prev").addEventListener("click", () => {
    state.page = Math.max(1, state.page - 1);
    renderTable();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("page-next").addEventListener("click", () => {
    state.page += 1;
    renderTable();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  // Clicking anywhere outside an open apply-links menu closes it.
  document.addEventListener("click", () => {
    document.querySelectorAll(".apply-menu-list.open").forEach((el) => el.classList.remove("open"));
  });
}

/* =========================================================================
   Startup
   ========================================================================= */
async function init() {
  readStateFromUrl();
  initFilterControls();
  await loadData();

  if (state.pendingCategorySlug) {
    const match = state.categories.find((c) => slugify(c.name) === state.pendingCategorySlug);
    if (match) state.filters.category = match.name;
    renderCategoryTabs();
    applyFiltersAndRender();
  }
}

init();
</script>
