# Central configuration for the whole app. Nothing here is a secret (those
# go in .env) — this file is about search scope, thresholds and limits, and
# is safe to commit and tweak over time.

locations:
  primary: "London, England, United Kingdom"
  secondary: ["England, United Kingdom"]
  # Cities/regions we treat as "in England" for the location filter (§6.2).
  # A job whose location text doesn't mention one of these (or "London"/
  # "England"/"UK"/"remote") is assumed to be outside England and dropped.
  england_cities:
    [London, Manchester, Birmingham, Leeds, Bristol, Cambridge, Oxford,
     Reading, Brighton, Newcastle, Nottingham, Sheffield, Liverpool,
     Milton Keynes, Southampton, Leicester, Coventry, York, Bath, Guildford]

# Keywords used to search LinkedIn (via Apify) ONLY — see linkedin_apify.py.
#
# Reed and Adzuna used to be searched with this same list too, but that
# meant any job whose title didn't contain one of these words was silently
# never fetched at all, no matter how good categories.yaml/relevance.yaml
# were at classifying it afterwards (confirmed live: dropping the keyword
# entirely and searching by location alone returned ~20x more real results
# from both APIs). Reed/Adzuna now search by location only (see reed.py /
# adzuna.py) and don't use this list. LinkedIn still needs it: unlike Reed/
# Adzuna, Apify's actor charges real money per result, so deliberately
# narrowing LinkedIn's search is the correct tradeoff there, not a
# limitation to work around.
search_keywords:
  - graduate
  - junior
  - entry level
  - associate
  - analyst
  - software engineer
  - data
  - marketing
  - finance
  - consultant
  - product
  - designer
  - operations
  - sales
  - intern
  - biotech
  - life sciences
  - pharma
  - pharmaceutical
  - clinical research
  - bioinformatics
  - computational biology
  - venture capital
  - equity research
  - health equity
  - public health
  - digital health

experience:
  max_years: 4
  # Whole-word, case-insensitive title matches that mean "not an
  # early-career role" — see filters.py. "architect" is deliberately not
  # in this default list, since "Solutions Architect" roles can be junior;
  # add it here if you want it excluded.
  excluded_title_words:
    [senior, sr, lead, principal, staff, "head of", director, vp,
     "vice president", chief, partner]

apify:
  # The spec originally named a different actor (supreme_coder/linkedin-
  # jobs-scraper), but it no longer exists on Apify (confirmed: calling it
  # returns "Actor with this name was not found"). This is its replacement,
  # picked and price-checked live before committing — see linkedin_apify.py.
  actor: "valig~linkedin-jobs-scraper"
  cooldown_minutes: 60
  monthly_budget_usd: 4.00
  # The spec assumed $0.10 per 1,000 results (that was this actor's price
  # before it was pulled). This actor's real Apify-free-tier price, checked
  # live, is $0.40 per 1,000 results.
  price_per_1000_usd: 0.40
  # This actor also charges a small flat fee every time it starts a run,
  # even for zero results. We run it once per search keyword (see
  # linkedin_apify.py), so a full refresh pays this fee once per keyword —
  # budget.py accounts for that when deciding whether a run is affordable.
  actor_start_fee_usd: 0.001
  # Sized so that one refresh a day, EVERY day of a 30-day month, stays
  # comfortably under the $4/month cap with no skipped days: (4.00 / 30
  # days) minus the daily start-fee overhead (27 keywords x $0.001 =
  # $0.027/day), divided by the per-result price ($0.0004), comes out to
  # ~266 results/day — set a little below that for margin. (Previously 290,
  # which actually worked out to ~$4.29/month once the biotech keywords
  # brought the keyword count to 27 — the hard budget cap in budget.py
  # never let it overspend, but it would start skipping days near the end
  # of the month. This value removes that.)
  max_results_per_run: 260
  posted_within_first_run: r604800   # past 7 days (LinkedIn's f_TPR param)
  posted_within_routine: r86400      # past 24 hours, for routine refreshes

reed:
  # Max results fetched per LOCATION pass (paged in batches of 100), not per
  # keyword any more — see reed.py. Raised from 300 now that this covers
  # every job in the area instead of one keyword's slice of it.
  results_per_query: 2000
  detail_concurrency: 5    # how many "fetch full description" calls run at once

adzuna:
  # Max pages fetched per LOCATION pass (50 results/page), not per keyword
  # any more — see adzuna.py. Raised from 3 (150 results) now that this
  # covers every job in the area instead of one keyword's slice of it.
  max_pages_per_query: 40
  max_days_old: 14

dedupe:
  company_threshold: 92   # rapidfuzz token_set_ratio for "same company"
  title_threshold: 90     # rapidfuzz token_sort_ratio for "same job title"

# A job missing from this many refreshes in a row gets marked inactive
# (see db.mark_missing_inactive).
inactive_after_missed_refreshes: 3

# Jobs older than this (by posted_at, which falls back to first-seen date
# when a source doesn't give one — see db.upsert_job) are hidden from the
# board. This is a display-time filter (db.get_active_jobs), re-evaluated on
# every page load, not a fetch-time filter — a job doesn't need a fresh
# refresh to age out once it crosses this cutoff.
max_posted_age_days: 21
