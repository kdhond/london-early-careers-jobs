# Ordered category rules (§7). Each job is checked against these, in this
# exact order, and the FIRST category whose keywords match the job's title
# wins — so more specific categories must come before more general ones.
#
# Note: "AI / Machine Learning" is listed here right after "Software
# Engineering", ahead of "Data & Analytics" — even though the spec's
# numbered list shows Data as #2 and AI as #3 — because the spec explicitly
# says AI/ML must be checked first, "so 'Data Scientist' goes here [in
# AI/ML]" rather than being caught by Data & Analytics' own "data analyst"-
# style keywords. The order in this file IS the matching priority; it's
# not just a display order.
#
# Each keyword is matched case-insensitively as a whole phrase (word
# boundaries on each side), against the job title first, then — only if no
# category matched on the title — against the full description. A job that
# still matches nothing falls back to "Other".

