# Personal relevance keywords (moved out of categories.yaml 2026-09-25 when
# the public site got a general job-TYPE taxonomy back — see
# config/categories.yaml). This file answers a completely different
# question: "is this relevant to Kailas's own biotech/VC/health-equity/
# finance search", regardless of what general `category` a job also gets.
# See jobboard/relevance.py.
#
# "Relevant" here means: biotech/life-sciences (research, clinical, pharma),
# biotech-flavoured AI/health-tech, biotech investing (equity research + VC),
# health equity, plus general finance/consulting and data/AI — the person's
# own resume plus explicit "I'm open to finance roles too, be inclusive"
# framing. Software engineering, product, design, marketing, sales, ops, HR,
# legal, cyber security and non-software engineering are NOT relevant.
#
# Keywords are matched case-insensitively as whole phrases (word boundaries
# on each side) against the job TITLE ONLY (see `title_only` below).
# Deliberately not falling back to the full job description: description
# text is full of unrelated boilerplate that happens to contain these
# words — "backed by venture capital" in a totally unrelated startup's About
# blurb, "private healthcare" in a benefits list, "Public Health" as the UK
# construction trade term (M&E = Mechanical, Electrical and Public Health,
# nothing to do with epidemiology) — which was confirmed live: it mislabeled
# things like "M&E Quantity Surveyor" and "Team Assistant" as relevant.
#
# A job whose title contains "Founder's Associate" / "Chief of Staff" /
# "Entrepreneur in Residence" is NOT matched by keywords here at all — those
# titles are sector-agnostic, so relevance.py resolves them via each
# company's `category_hint` (config/companies.yaml) before it ever reaches
# this keyword list. Same hint is also used as a last-resort fallback for
# ANY other job at one of those verified biotech/VC/health-equity companies
# that no keyword below happens to catch — EXCEPT software/hardware/data/ML/
# AI engineering titles, which are explicitly excluded from that fallback
# (see jobboard/relevance.py) since engineering roles aren't relevant to
# this search even at a verified biotech company.
#
# 2026-09-30 rework: Kailas has a biomedical sciences background, not an ML/
# AI engineering one — a generic "Data Engineer"/"ML Engineer"/"AI Engineer"
# title he isn't qualified for was sneaking into Relevant just because the
# posting mentioned "AI" or "data engineer" (e.g. IQVIA's "Agentic AI, Data
# Engineer COA Accelerator" — a pure data-engineering build role, not a
# biology one). Generic finance/VC titles had the same problem: "Investment
# Analyst"/"Venture Associate" matched regardless of sector, even at a
# totally unrelated (non-biotech) fund. Fix: removed the old generic
# "Data, analytics & AI (general)" and "General finance & accounting"
# buckets entirely, and narrowed the VC/equity-research bucket to require an
# explicit biotech/healthcare/pharma/life-sciences qualifier IN THE TITLE.
# A generic finance/VC/data role at a company we've separately verified as
# biotech/VC/health-equity (config/companies.yaml's category_hint) still
# gets through via the hint fallback in relevance.py — this only stops
# UNQUALIFIED generic titles from sources (Reed/Adzuna/LinkedIn) that carry
# no company hint at all. Biology/life-sciences titles were also expanded,
# per "more emphasis on biology and life sciences roles that could use some
# AI but aren't AI primarily."

- name: Relevant
  title_only: true
  keywords:
    # Health equity / public health
    - health equity
    - public health
    - community health
    - perinatal health
    - maternal health
    - social determinants of health
    - health disparities
    - health access
    - underserved communities
    - care coordination
    - population health
    # Venture capital — bio/health/pharma-qualified only (see 2026-09-30
    # note above: bare "venture capital"/"venture associate"/"vc analyst"
    # etc. matched any sector, not just biotech, and were removed).
    - biotech venture
    - healthcare venture
    - health venture
    - life sciences venture
    - biotech vc
    - healthcare vc
    - life sciences vc
    - digital health venture
    - biotech venture capital
    - healthcare venture capital
    - life sciences venture capital
    - biotech investor
    - healthcare investor
    - life sciences investor
    # Equity research / investment banking — same bio/health/pharma
    # qualification as VC above (bare "equity research"/"investment
    # banking"/"investment analyst"/"research analyst" removed 2026-09-30,
    # see note above).
    - biotech equity
    - healthcare equity
    - life sciences equity
    - biotech analyst
    - healthcare analyst
    - pharma analyst
    - pharmaceutical analyst
    - life sciences analyst
    - scientific due diligence
    - biotech equity research
    - healthcare equity research
    - life sciences equity research
    - pharma equity research
    - biotech investment banking
    - healthcare investment banking
    - life sciences investment banking
    - biotech investment analyst
    - healthcare investment analyst
    - life sciences investment analyst
    - biotech private equity
    - healthcare private equity
    - life sciences private equity
    - biotech M&A
    - healthcare M&A
    # Biotech / health AI — AI keywords are ONLY relevant when they're
    # explicitly biology/health-flavoured, never bare "AI"/"machine
    # learning"/"data engineer" (see 2026-09-30 note above).
    - biotech ai
    - health ai
    - healthtech
    - health tech
    - digital health
    - clinical ai
    - computational biology
    - bioinformatics
    - drug discovery
    - protein design
    - precision medicine
    - genomics
    # Biotech, health & life sciences — expanded 2026-09-30 to give this
    # bucket (Kailas's actual background) more coverage, since it's now the
    # primary route into Relevant rather than generic AI/data keywords.
    - biotech
    - biotechnology
    - life sciences
    - life science
    - biologist
    - biology
    - clinical research
    - clinical trial
    - clinical operations
    - clinical development
    - biomedical
    - pharma
    - pharmaceutical
    - healthcare
    - medical affairs
    - medical writer
    - medical science liaison
    - regulatory affairs
    - pharmacovigilance
    - research scientist
    - laboratory
    - molecular biology
    - cell biology
    - structural biology
    - microbiology
    - immunology
    - oncology
    - virology
    - neuroscience
    - toxicology
    - biochemistry
    - biostatistics
    - epidemiology
    - translational research
    - translational medicine
    - preclinical
    - biomanufacturing
    - bioprocess
    - process development
    - protein engineering
    # Consulting & strategy — deliberately NOT the bare words "consultant" /
    # "consulting": recruitment agencies use "Consultant" as a generic sales
    # job title ("Recruitment Consultant", "Luxury Sales Consultant",
    # "Assistant Acoustic Consultant"), which isn't what's meant here.
    # Specific phrases only.
    - management consultant
    - strategy consultant
    - associate consultant
    - consulting analyst
    - strategy analyst
    - management consulting
    - strategy consulting
